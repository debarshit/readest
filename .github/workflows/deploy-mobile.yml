name: Deploy Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
    inputs:
      release_track:
        description: 'Google Play Release Track (internal, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - beta
          - production
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # iOS App Store Build & Deploy Job
  # ==========================================
  deploy-ios:
    name: Build & Deploy iOS (.ipa)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Restore App Store Credentials
        run: |
          mkdir -p apps/readest-app/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > apps/readest-app/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}" > apps/readest-app/.env.ios-appstore.local
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> apps/readest-app/.env.ios-appstore.local
          echo "APPLE_API_KEY_PATH=$GITHUB_WORKSPACE/apps/readest-app/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> apps/readest-app/.env.ios-appstore.local

      - name: Install Apple Distribution Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary-ci-password"
        run: |
          # 1. Install Provisioning Profile
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/Yomi_AppStore.mobileprovision"

          # 2. Setup Keychain and import Distribution Certificate
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e s/\"//g)
          fi

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Vendor Assets (PDF.js, SimpleCC WASM, Jieba)
        run: |
          cd apps/readest-app
          pnpm setup-vendors

      - name: Create .env.local for Next.js
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > apps/readest-app/.env.local

      - name: Initialize iOS Target
        run: |
          cd apps/readest-app
          pnpm tauri ios init

      - name: Configure iOS ExportOptions
        run: |
          cat << 'EOF' > apps/readest-app/src-tauri/gen/apple/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9W7R4BWG7X</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.biblophile.yomi</key>
                  <string>Yomi App Store Distribution</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^[ ]*//' apps/readest-app/src-tauri/gen/apple/ExportOptions.plist || true

      - name: Auto-increment iOS Build Number (CFBundleVersion)
        run: |
          BUILD_NUM=${{ github.run_number }}
          if [ -f "apps/readest-app/src-tauri/gen/apple/project.yml" ]; then
            sed -i '' "s/CFBundleVersion: .*/CFBundleVersion: \"$BUILD_NUM\"/" apps/readest-app/src-tauri/gen/apple/project.yml
            (cd apps/readest-app/src-tauri/gen/apple && env -u FORCE_COLOR xcodegen generate)
          fi

      - name: Build iOS Production Bundle (.ipa)
        run: |
          cd apps/readest-app
          pnpm run build-ios-appstore
          bash scripts/fix-ios-appstore-appgroup.sh src-tauri/gen/apple/build/arm64/Readest.ipa
          bash scripts/verify-ios-appstore-entitlements.sh src-tauri/gen/apple/build/arm64/Readest.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yomi-ios-ipa
          path: apps/readest-app/src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect
        run: |
          cd apps/readest-app
          pnpm exec dotenv -e .env.ios-appstore.local -- bash -c \
            'xcrun altool --upload-app --type ios --file src-tauri/gen/apple/build/arm64/Readest.ipa --apiKey $APPLE_API_KEY --apiIssuer $APPLE_API_ISSUER'

  # ==========================================
  # Android Google Play Build & Deploy Job
  # ==========================================
  deploy-android:
    name: Build & Deploy Android (.aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Restore Google Play Secrets & Keystore
        run: |
          mkdir -p fastlane
          echo "${{ secrets.GOOGLE_PLAY_KEY_JSON_BASE64 }}" | base64 --decode > fastlane/google-play-key.json
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEY_BASE64 }}" | base64 --decode > apps/readest-app/release.keystore

          echo "PACKAGE_NAME=com.biblophile.yomi" > apps/readest-app/.env.google-play.local
          echo "GOOGLE_PLAY_JSON_KEY_FILE=$GITHUB_WORKSPACE/fastlane/google-play-key.json" >> apps/readest-app/.env.google-play.local
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/apps/readest-app/release.keystore" >> apps/readest-app/.env.google-play.local
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}" >> apps/readest-app/.env.google-play.local
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> apps/readest-app/.env.google-play.local
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> apps/readest-app/.env.google-play.local

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Vendor Assets (PDF.js, SimpleCC WASM, Jieba)
        run: |
          cd apps/readest-app
          pnpm setup-vendors

      - name: Create .env.local for Next.js
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > apps/readest-app/.env.local

      - name: Initialize Android Target & Keystore
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > src-tauri/gen/android/keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> src-tauri/gen/android/keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> src-tauri/gen/android/keystore.properties
          echo "storeFile=$GITHUB_WORKSPACE/apps/readest-app/release.keystore" >> src-tauri/gen/android/keystore.properties

      - name: Build Android Production App Bundle (.aab)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ORG_GRADLE_PROJECT_storeFlavor: googleplay
        run: |
          cd apps/readest-app
          if grep -q 'REQUEST_INSTALL_PACKAGES' src-tauri/gen/android/app/src/main/AndroidManifest.xml; then
            sed -i '/REQUEST_INSTALL_PACKAGES/d' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          fi
          pnpm tauri android build --bundle aab

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yomi-android-aab
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Deploy to Google Play Console via Fastlane
        run: |
          TRACK="${{ github.event.inputs.release_track || 'internal' }}"
          cd apps/readest-app
          pnpm exec dotenv -e .env.google-play.local -- bash -c "cd ../.. && fastlane android upload_${TRACK}"
