name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - aarch64 (arm64)
          - all

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Vendor Assets (PDF.js, SimpleCC WASM, Jieba)
        run: |
          cd apps/readest-app
          pnpm setup-vendors

      - name: Create .env.local for Next.js
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > apps/readest-app/.env.local

      - name: Initialize Android Target
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

      - name: Configure Keystore (for Release builds)
        if: ${{ inputs.build_type == 'release' }}
        run: |
          KEYSTORE_BASE64="${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEY_BASE64 }}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > apps/readest-app/src-tauri/gen/android/keystore.properties
            echo "password=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> apps/readest-app/src-tauri/gen/android/keystore.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> apps/readest-app/src-tauri/gen/android/keystore.properties
            echo "storeFile=$RUNNER_TEMP/release.keystore" >> apps/readest-app/src-tauri/gen/android/keystore.properties
          fi

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app
          EXTRA_FLAGS=""
          BUILD_SUBDIR="release"
          if [ "${{ inputs.build_type }}" == "debug" ]; then
            EXTRA_FLAGS="--debug"
            BUILD_SUBDIR="debug"
          fi

          TARGET="${{ inputs.target_arch }}"
          OUTPUT_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/${BUILD_SUBDIR}"
          mkdir -p "$OUTPUT_DIR"

          if [ "$TARGET" == "universal" ]; then
            pnpm tauri android build $EXTRA_FLAGS
          elif [ "$TARGET" == "aarch64 (arm64)" ]; then
            pnpm tauri android build -t aarch64 $EXTRA_FLAGS
          elif [ "$TARGET" == "all" ]; then
            pnpm tauri android build $EXTRA_FLAGS
            cp ${OUTPUT_DIR}/app-universal-${BUILD_SUBDIR}.apk ${OUTPUT_DIR}/app-universal-built.apk || true

            pnpm tauri android build -t aarch64 $EXTRA_FLAGS
            cp ${OUTPUT_DIR}/app-universal-${BUILD_SUBDIR}.apk ${OUTPUT_DIR}/app-arm64-${BUILD_SUBDIR}.apk || true

            pnpm tauri android build -t armv7 $EXTRA_FLAGS
            cp ${OUTPUT_DIR}/app-universal-${BUILD_SUBDIR}.apk ${OUTPUT_DIR}/app-armv7-${BUILD_SUBDIR}.apk || true

            pnpm tauri android build -t x86_64 $EXTRA_FLAGS
            cp ${OUTPUT_DIR}/app-universal-${BUILD_SUBDIR}.apk ${OUTPUT_DIR}/app-x86_64-${BUILD_SUBDIR}.apk || true

            cp ${OUTPUT_DIR}/app-universal-built.apk ${OUTPUT_DIR}/app-universal-${BUILD_SUBDIR}.apk || true
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomi-android-apk-${{ inputs.build_type }}
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
